<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalPoint</title>
<style>
/* Layout idea: quiet gallery. One glass bar, a large calm headline, white cards floating on a soft grey field, colour only where state lives. */
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --sunk:#F5F5F7; --ink:#1D1D1F; --muted:#6E6E73; --line:rgba(0,0,0,.08);
  --accent:#0071E3; --accent-ink:#FFFFFF; --accent-soft:rgba(0,113,227,.10); --glass:rgba(255,255,255,.72);
  --fav:#1D8348; --adv:#D70015; --mix:#B25000; --und:#6E6E73;
  --fav-bg:rgba(52,199,89,.15); --adv-bg:rgba(255,59,48,.12); --mix-bg:rgba(255,149,0,.16); --und-bg:rgba(0,0,0,.06);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.06);
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r:20px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#000000; --surface:#1C1C1E; --sunk:#2C2C2E; --ink:#F5F5F7; --muted:#98989D; --line:rgba(255,255,255,.10);
    --accent:#2997FF; --accent-ink:#FFFFFF; --accent-soft:rgba(41,151,255,.16); --glass:rgba(22,22,23,.72);
    --fav:#30D158; --adv:#FF453A; --mix:#FF9F0A; --und:#98989D;
    --fav-bg:rgba(48,209,88,.16); --adv-bg:rgba(255,69,58,.16); --mix-bg:rgba(255,159,10,.16); --und-bg:rgba(255,255,255,.08);
    --shadow:0 0 0 1px rgba(255,255,255,.06);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --surface:#1C1C1E; --sunk:#2C2C2E; --ink:#F5F5F7; --muted:#98989D; --line:rgba(255,255,255,.10);
  --accent:#2997FF; --accent-ink:#FFFFFF; --accent-soft:rgba(41,151,255,.16); --glass:rgba(22,22,23,.72);
  --fav:#30D158; --adv:#FF453A; --mix:#FF9F0A; --und:#98989D;
  --fav-bg:rgba(48,209,88,.16); --adv-bg:rgba(255,69,58,.16); --mix-bg:rgba(255,159,10,.16); --und-bg:rgba(255,255,255,.08);
  --shadow:0 0 0 1px rgba(255,255,255,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:10px}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
header.top{position:sticky;top:0;z-index:5;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.mark{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.02em}
.mark svg{width:22px;height:22px;flex:none}
nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto;background:var(--und-bg);padding:3px;border-radius:999px}
nav button{background:none;border:0;padding:6px 14px;border-radius:999px;color:var(--muted);font-size:13.5px;font-weight:500;transition:color .2s,background .3s var(--ease),box-shadow .3s}
nav button:hover{color:var(--ink)}
nav button[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
nav .n{font-size:11.5px;margin-left:5px;color:var(--muted);font-variant-numeric:tabular-nums}
main{padding:0 0 80px}
.strip{padding:56px 0 34px;display:grid;gap:14px}
.strip h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,5.4vw,56px);line-height:1.05;letter-spacing:-.035em;margin:0;text-wrap:balance;max-width:16ch}
.strip h1 em{font-style:normal;color:var(--muted)}
.strip .facts{color:var(--muted);font-size:19px;line-height:1.4;max-width:54ch;letter-spacing:-.015em}
.hero{display:grid;grid-template-columns:1fr minmax(280px,420px);gap:40px;align-items:end;padding:56px 0 36px}
.hero .strip{padding:0}
.stats{display:flex;gap:34px;flex-wrap:wrap;margin-top:10px}
.stat b{display:block;font-family:var(--display);font-weight:600;font-size:34px;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.status{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.status b{font-weight:500;color:var(--ink)}
.status.stale b{color:var(--mix)}
.pulse{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px 12px}
.pulse h5{margin:0 0 6px;font-size:13px;font-weight:600}
.pulse svg{width:100%;height:auto;display:block;overflow:visible}
.pulse text{fill:var(--muted);font-family:var(--body);font-size:18px}
.pulse .axis{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.desk{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:22px;align-items:start}
.rail{display:flex;flex-direction:column;gap:12px;min-width:0}
.tools{display:flex;flex-direction:column;gap:12px}
.search{width:100%;padding:10px 16px;border:0;border-radius:12px;background:var(--und-bg);transition:background .2s,box-shadow .2s}
.search::placeholder{color:var(--muted)}
.search:focus{outline:0;background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft),0 0 0 1px var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--und-bg);border-radius:999px;padding:5px 13px;font-size:13px;color:var(--ink);transition:background .2s,color .2s,transform .2s var(--ease)}
.chip:hover{transform:translateY(-1px)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.slip{display:block;width:100%;text-align:left;background:var(--surface);border:0;border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.slip:hover{transform:translateY(-2px) scale(1.005)}
.slip[aria-selected="true"]{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.meta>span+span::before{content:"\00B7";margin-right:8px}
.slip .meta::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--und);flex:none}
.slip.s-fav .meta::before{background:var(--fav)} .slip.s-adv .meta::before{background:var(--adv)} .slip.s-mix .meta::before{background:var(--mix)}
.slip h3{font-family:var(--display);font-weight:600;font-size:15.5px;line-height:1.3;letter-spacing:-.015em;margin:8px 0 10px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.imp{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.imp.fav{background:var(--fav-bg);color:var(--fav)} .imp.adv{background:var(--adv-bg);color:var(--adv)}
.imp.mix{background:var(--mix-bg);color:var(--mix)} .imp.und{background:var(--und-bg);color:var(--und)}
.star{color:var(--accent);font-weight:500}
.grade{color:var(--ink);font-weight:500}
.paper{background:var(--surface);border-radius:var(--r);padding:38px 42px;min-width:0;box-shadow:var(--shadow)}
.paper h2{font-family:var(--display);font-weight:700;font-size:clamp(24px,3vw,32px);line-height:1.12;letter-spacing:-.03em;margin:12px 0 0;text-wrap:balance;max-width:24ch}
.paper .lede{font-size:18px;line-height:1.45;color:var(--muted);max-width:60ch;margin:14px 0 0;letter-spacing:-.015em}
.sec{margin-top:36px}
.sec h4{font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted);margin:0 0 14px}
.bar{display:flex;height:6px;border-radius:999px;overflow:hidden;gap:2px;margin-bottom:16px;background:var(--und-bg)}
.bar i{display:block;height:100%;border-radius:999px;transform-origin:left}
.bar .fav{background:var(--fav)} .bar .adv{background:var(--adv)} .bar .mix{background:var(--mix)} .bar .und{background:var(--und);opacity:.45}
.actors{display:grid}
.actor{display:grid;grid-template-columns:150px 128px 1fr;gap:14px;align-items:start;padding:13px 0;border-top:1px solid var(--line)}
.actor .who{font-weight:600} .actor .tk{font-size:12px;color:var(--muted);display:block}
.actor p{margin:0}
ul.plain{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cp{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.box{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:50%;margin-top:1px;display:grid;place-items:center;font-size:11px;line-height:1;opacity:.9}
.box.observed{background:var(--accent);border-color:var(--accent);color:#fff}
.box.not_observed{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.box.inconclusive{border-style:dashed}
.imp.obs{background:var(--accent-soft);color:var(--accent)}
.due{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.unk li{padding:10px 14px;background:var(--sunk);border-radius:12px;max-width:65ch}
.src{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.src a{color:var(--accent);text-decoration:none}
.src a:hover{text-decoration:underline}
.note{font-size:12.5px;color:var(--muted);max-width:70ch}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:9px 20px;font-weight:500;transition:transform .2s var(--ease),filter .2s}
.btn:hover:not(:disabled){filter:brightness(1.08);transform:scale(1.02)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--und-bg);color:var(--accent)}
.back{display:none;margin-bottom:14px}
.empty{color:var(--muted);padding:44px 26px;text-align:center;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.two{display:grid;grid-template-columns:minmax(280px,440px) 1fr;gap:22px;align-items:start}
textarea{width:100%;min-height:240px;padding:14px 16px;border:0;border-radius:14px;background:var(--sunk);resize:vertical;transition:box-shadow .2s}
textarea:focus{outline:0;box-shadow:0 0 0 4px var(--accent-soft),0 0 0 1px var(--accent)}
label{font-weight:600;display:block;margin-bottom:8px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse}
.tablewrap{overflow-x:auto}
th{font-weight:500;font-size:12px;color:var(--muted);text-align:left;padding:10px 14px;white-space:nowrap}
td{padding:13px 14px;border-top:1px solid var(--line);vertical-align:top}
td.d{font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
td button{background:none;border:0;padding:0;color:var(--accent);text-align:left}
td button:hover{text-decoration:underline}
.ledger{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:28px 34px;margin-bottom:22px}
.ring{width:150px;height:150px}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .track{stroke:var(--und-bg)}
.ring text{font-family:var(--display);fill:var(--ink)}
.tally{display:flex;gap:34px;flex-wrap:wrap}
.tile b{display:block;font-family:var(--display);font-weight:600;font-size:34px;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.lens{background:var(--accent-soft);border-radius:16px;padding:22px 24px;margin-top:28px}
.lens h4{color:var(--accent)}
.lens p{margin:0 0 14px;max-width:60ch}
.lens .lv{font-family:var(--display);font-weight:600;font-size:17px;margin-bottom:6px}
.lens .note{margin:12px 0 0}
.plans{margin-top:34px}.plans h4{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 6px}.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:12px}.plan{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px}.plan b{display:block;font-size:17px;letter-spacing:-.02em}.plan-price{display:block;font-size:12.5px;color:var(--muted);margin:2px 0 8px}.plan p{margin:0;font-size:14px}
.note.problem{color:var(--mix)}
.note.inyour{color:var(--ink);font-weight:500;margin:0 0 8px}
.numbers{background:var(--sunk);border-radius:16px;padding:22px 24px;margin-top:20px}
.numbers .actor:first-child{border-top:0}
.numbers .actor .note{grid-column:1/-1;margin:0}
.numcard{margin-bottom:22px}
.mhead{padding:34px 0 20px;gap:10px}
.mhead h1{font-size:clamp(28px,3.6vw,40px);max-width:none}
.mhead .facts{font-size:16px}
.mhead .status{margin:2px 0 0;display:block}
.cmd{position:relative;max-width:640px;margin-top:6px}
.cmd .search{width:100%;font-size:16px;padding:14px 18px;background:var(--surface);box-shadow:var(--shadow)}
.cmd-res{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:2px}
.cmd-h{font-size:12px;color:var(--muted);margin:8px 10px 4px}
.cmd-item{display:flex;justify-content:space-between;gap:16px;align-items:baseline;background:none;border:0;border-radius:10px;padding:9px 10px;text-align:left;width:100%}
.cmd-item:hover,.cmd-item:focus-visible{background:var(--sunk)}
.cmd-item b{font-weight:500}.cmd-item span{color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mgroup h4,.mh{font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted);margin:0 0 10px}
.mgroup{margin-bottom:8px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile-m{display:grid;grid-template-columns:1fr auto;grid-template-areas:"name name" "val val" "chg spark";gap:4px 10px;align-items:end;text-align:left;background:var(--surface);border:0;border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);transition:transform .35s var(--ease),box-shadow .35s var(--ease);min-width:0;animation:rise .5s var(--ease) both}
.tile-m:hover{transform:translateY(-2px)}
.tile-m[aria-current]{outline:2px solid var(--accent);outline-offset:-2px}
.tm-name{grid-area:name;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-val{grid-area:val;font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.tm-chg{grid-area:chg;font-size:13px;font-variant-numeric:tabular-nums}
.tm-chg.up,.tm-spark.up,.mchart.up{color:var(--fav)}.tm-chg.down,.tm-spark.down,.mchart.down{color:var(--adv)}.tm-chg.flat,.tm-spark.flat,.mchart.flat{color:var(--muted)}
.tm-spark{grid-area:spark;width:64px;height:24px}
.spark{display:block;width:100%;height:100%}
.enter .spark polyline{stroke-dasharray:1200;stroke-dashoffset:1200;animation:mdraw 1.1s var(--ease) .1s forwards}
@keyframes mdraw{to{stroke-dashoffset:0}}
.mdetail h2{font-family:var(--display);font-weight:650;font-size:clamp(24px,3vw,32px);letter-spacing:-.03em;margin:6px 0 4px}
.mbig{font-family:var(--display);font-weight:650;font-size:clamp(34px,4.6vw,52px);letter-spacing:-.035em;line-height:1.05;margin:0 0 6px;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;align-items:baseline;gap:12px}
.mbig .tm-chg{font-family:var(--body,inherit);font-weight:400;font-size:15px;letter-spacing:0}
.mchart{height:130px;margin:14px 0 4px}
.mrow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.mstats{display:flex;gap:30px;flex-wrap:wrap;margin:18px 0 4px}
.mstats b{display:block;font-family:var(--display);font-weight:600;font-size:19px;font-variant-numeric:tabular-nums}
.mstats span{font-size:12px;color:var(--muted)}
.mdesk .cp{grid-template-columns:52px 1fr}
.two .cp{grid-template-columns:52px 1fr}
@media (max-width:880px){.mbig{font-size:34px}}
/* Markets, second pass: the headline is the market; rows instead of cards; one live chart. */
.mhero{position:relative;z-index:2;background:#000;color:#F5F5F7;border-radius:28px;padding:40px 50px 0;margin:26px 0 24px}
.mhero h1{font-family:var(--display);font-weight:700;font-size:clamp(27px,4.3vw,56px);line-height:1.06;letter-spacing:-.04em;margin:0}
.clause{display:block;background:none;border:0;padding:0;color:inherit;font:inherit;letter-spacing:inherit;text-align:left;text-decoration:underline transparent;text-decoration-thickness:3px;text-underline-offset:8px;transition:text-decoration-color .3s}
.enter .clause{opacity:0;animation:clauseIn .8s var(--ease) forwards;animation-delay:calc(var(--i)*.32s + .1s)}
.clause:hover,.clause:focus-visible{text-decoration-color:rgba(255,255,255,.45);outline:0}
.clause .up{color:#30D158}.clause .down{color:#FF453A}.clause .flat{color:#98989D}
@keyframes clauseIn{from{opacity:0;filter:blur(8px);transform:translateY(10px)}to{opacity:1;filter:none;transform:none}}
.mwait{padding-bottom:40px}.mwait h1{color:#6E6E73}
.mwhen{color:#98989D;font-size:13px;line-height:1.45;max-width:72ch;margin:20px 0 22px}
.mhero .cmd{margin:0;max-width:620px}
.mhero .cmd .search{background:rgba(255,255,255,.12);color:#F5F5F7;box-shadow:none;border:0}
.mhero .cmd .search::placeholder{color:#98989D}
.mhero .cmd-res{color:var(--ink)}
.tape{margin:34px -50px 0;padding:15px 0;border-top:1px solid rgba(255,255,255,.14);overflow:hidden;border-radius:0 0 28px 28px}
.tape-run{display:inline-flex;gap:40px;padding-left:40px;white-space:nowrap;animation:tape 70s linear infinite}
.tape:hover .tape-run{animation-play-state:paused}
@keyframes tape{to{transform:translateX(-50%)}}
.tp{font-size:13px;color:#98989D;font-variant-numeric:tabular-nums}
.tp b{color:#F5F5F7;font-weight:500;margin-right:4px}.tp i{font-style:normal;margin-left:4px}.tp i.up{color:#30D158}.tp i.down{color:#FF453A}
.mgroup{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:4px 0 6px;margin-bottom:14px;overflow:hidden}
.mgroup h4{margin:14px 20px 6px}
.mgrid{display:block}
.tile-m{display:grid;grid-template-columns:minmax(0,1fr) 62px auto;grid-template-areas:"name spark val" "name spark chg";column-gap:14px;row-gap:3px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none;padding:12px 20px;text-align:left;animation:none;transition:background .25s}
.mgrid .tile-m:first-child{border-top:0}
.tile-m:hover{transform:none;background:var(--sunk)}
.tile-m[aria-current]{outline:0;background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.tile-m .tm-name{grid-area:name;font-size:14.5px;font-weight:500;color:var(--ink);white-space:normal;line-height:1.25}
.tile-m .tm-spark{grid-area:spark;width:62px;height:26px}
.tile-m .tm-val{grid-area:val;justify-self:end;font-family:var(--body);font-weight:500;font-size:15px;letter-spacing:-.01em}
.tile-m .tm-chg{grid-area:chg;justify-self:end;font-size:12px;font-weight:500;border-radius:6px;padding:1px 7px;min-width:66px;text-align:center;color:#fff}
.tile-m .tm-chg.up{background:var(--fav)}.tile-m .tm-chg.down{background:var(--adv)}.tile-m .tm-chg.flat{background:none;color:var(--muted);padding:0;min-width:0;font-weight:400}
.mchart{position:relative;height:190px;margin:30px 0 6px;touch-action:pan-y;cursor:crosshair}
.mchart svg{display:block;width:100%;height:100%;overflow:visible}
.mchart .grid{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}

function signed(n){return (n>0?"+":"")+money(n)}
function validMove(m){return !!m&&DRIVERS.indexOf(m.driver)>=0&&typeof m.change==="number"&&isFinite(m.change)&&Math.abs(m.change)<=100&&m.change!==0&&(m.unit==="pp"||m.unit==="%")&&typeof m.label==="string"&&!!m.label.trim()&&typeof m.period==="string"&&!!m.period.trim()&&(m.basis==="official"||m.basis==="reported")}
function validItem(x){return !!x&&typeof x.id==="string"&&!!KINDS[x.kind]&&typeof x.amount==="number"&&isFinite(x.amount)&&x.amount>0&&x.amount<=1e12}
function numbersFor(b){
  var out=[];
  (S.moves[b.id]||[]).forEach(function(m){S.items.forEach(function(it){var k=KINDS[it.kind];if(k.driver===m.driver)out.push({item:it,kind:k,move:m,impact:it.amount*m.change/100})})});
  return out;
}
function numbersTotal(b){return numbersFor(b).reduce(function(s,l){return s+l.impact},0)}
function numbersChip(b){
  if(b.private||!S.items.length)return"";
  var lines=numbersFor(b);if(!lines.length)return"";
  return '<p class="note inyour">In your numbers: '+esc(signed(numbersTotal(b)))+" a year under a one-for-one assumption</p>";
}
function numbersBlock(b){
  var moves=S.moves[b.id]||[];if(!moves.length)return"";
  var head='<section class="sec numbers"><h4>In your numbers</h4>',lines=numbersFor(b);
  var measured='<p class="note">Measured in this brief: '+moves.map(function(m){return esc(m.label)+" "+(m.change>0?"+":"−")+esc(String(Math.abs(m.change)))+(m.unit==="pp"?" percentage points":"%")+", "+esc(m.period)+" ("+(m.basis==="official"?"official figure":"as reported by press")+")"}).join("; ")+".</p>";
  if(!S.items.length)return head+measured+'<p>Enter an amount once and SignalPoint works out what a measured move means for it. The arithmetic runs on this page; your amounts are never sent to an AI model.</p><button class="btn" data-view="exposure">Add my numbers</button></section>';
  if(!lines.length)return head+measured+'<p class="note">None of the amounts you entered is tied to this move.</p></section>';
  return head+'<div class="actors">'+lines.map(function(l){
    var up=l.impact>0;
    return '<div class="actor"><div><span class="who">'+esc(l.kind.label)+'</span></div><div><span class="imp '+(up?"adv":"fav")+'">'+esc(signed(l.impact))+"</span></div><p>"+esc(money(l.item.amount))+" × "+esc(String(Math.abs(l.move.change)))+(l.move.unit==="pp"?" percentage points":"%")+" = "+esc(money(Math.abs(l.impact)))+" "+(up?"more":"less")+" "+esc(l.kind.per)+", if "+esc(l.kind.assume)+'.</p><p class="note">'+esc(l.kind.limit)+(/^one session/i.test(l.move.period)?" This is a single-session move; daily prices often reverse.":"")+"</p></div>"}).join("")+"</div>"+measured+
    '<p class="note">Arithmetic on the amounts you entered and the move measured in the source. It shows sensitivity under the stated assumption, not what you will pay. It is not a forecast, a quote or advice.</p></section>';
}
function numbersCard(){
  var rows=S.items.map(function(it,i){return '<li class="cp"><span>'+esc(KINDS[it.kind].label)+'</span><span class="due">'+esc(money(it.amount))+'</span><button class="chipx" data-rmitem="'+i+'" aria-label="Remove '+esc(KINDS[it.kind].label)+'">✕</button></li>'}).join("");
  var per=all().filter(function(b){return !b.private&&numbersFor(b).length}).map(function(b){return {b:b,total:numbersTotal(b)}});
  var summary=!S.items.length?'<p class="note">Nothing entered yet. Example: 500,000 of borrowing you will refinance, or 120,000 a year spent on fuel.</p>':
    !per.length?'<p class="note">No brief in this edition measures a move tied to your amounts.</p>':
    '<p class="note" style="margin:14px 0 6px">'+per.length+(per.length===1?" event measures":" events measure")+' a move tied to your amounts. Each is a separate scenario.</p>'+'<ul class="plain">'+per.map(function(p){return '<li class="cp"><button class="linkish" data-open="'+esc(p.b.id)+'">'+esc(p.b.title)+'</button><span class="due">'+esc(signed(p.total))+"</span></li>"}).join("")+'</ul><p class="note" style="margin-top:10px">SignalPoint does not add these up: the moves overlap, reverse and are measured over different periods.</p>';
  return '<section class="paper numcard" aria-labelledby="num-h"><h4 id="num-h">Your numbers</h4><p class="note">Tell SignalPoint the size of what you are exposed to. When a brief measures a move, it shows the arithmetic on your amount. Stored only in this browser and your private account state; never sent to an AI model.</p>'+
    '<form id="item-form" class="row" style="margin-top:12px"><label class="sr" for="item-kind">Kind of exposure</label><select id="item-kind" class="search" style="max-width:340px">'+Object.keys(KINDS).map(function(k){return '<option value="'+k+'">'+esc(KINDS[k].label)+"</option>"}).join("")+'</select><label class="sr" for="item-amount">Amount in US dollars</label><input class="search" id="item-amount" type="number" min="1" step="any" inputmode="decimal" placeholder="Amount in USD" style="max-width:180px"><button class="btn ghost" type="submit">Add</button></form>'+
    (S.itemErr?'<p class="note problem" role="alert">'+esc(S.itemErr)+"</p>":"")+(rows?'<ul class="plain" style="margin-top:14px">'+rows+"</ul>":"")+summary+"</section>";
}
/* ---------- Front-page calculator: the same arithmetic, before anything is saved ---------- */
function tryMove(kind){
  var k=KINDS[kind];if(!k)return null;var list=all();
  for(var i=0;i<list.length;i++){var ms=S.moves[list[i].id]||[];for(var j=0;j<ms.length;j++)if(ms[j].driver===k.driver)return {b:list[i],m:ms[j],k:k}}
  return null;
}
function tryKinds(){return Object.keys(KINDS).filter(function(k){return !!tryMove(k)})}
function tryOut(){
  var kinds=tryKinds();if(kinds.indexOf(S.tryKind)<0)S.tryKind=kinds[0];
  var hit=tryMove(S.tryKind);if(!hit)return"";
  var amt=Number(S.tryAmount),ok=isFinite(amt)&&amt>0&&amt<=1e12,m=hit.m,unit=m.unit==="pp"?" percentage points":"%";
  var moveTxt=esc(m.label)+" "+(m.change>0?"+":"−")+esc(String(Math.abs(m.change)))+unit+", "+esc(m.period)+" ("+(m.basis==="official"?"official figure":"as reported by press")+")";
  if(!ok)return '<p class="try-move">'+moveTxt+'</p><p class="note">Type an amount to see the line.</p>';
  var imp=amt*m.change/100,up=imp>0;
  return '<p class="try-result"><b class="'+(up?"up":"down")+'">'+esc(signed(imp))+'</b><span> '+esc(hit.k.per)+'</span></p><p class="try-formula">'+esc(money(amt))+" × "+esc(String(Math.abs(m.change)))+unit+", if "+esc(hit.k.assume)+'.</p><p class="try-move">'+moveTxt+'</p><p class="note">'+esc(hit.k.limit)+' Sensitivity, not a forecast, a quote or advice. Worked out on this page; nothing is sent anywhere.</p><div class="row"><button class="btn" id="try-keep"'+(S.personalReady?"":" disabled")+'>Keep this amount</button><button class="btn ghost" data-open="'+esc(hit.b.id)+'">Open the event</button></div>';
}
function tryBar(){
  if(!S.loaded)return"";
  var kinds=tryKinds();if(!kinds.length)return"";
  if(S.items.length){
    var per=all().filter(function(b){return !b.private&&numbersFor(b).length});
    if(!per.length)return"";
    return '<section class="trybar slim" aria-label="In your numbers"><p><b>In your numbers.</b> '+per.length+(per.length===1?" event in this edition measures":" events in this edition measure")+' a move tied to the amounts you entered.</p><button class="btn ghost" data-view="exposure">See the lines</button></section>';
  }
  if(kinds.indexOf(S.tryKind)<0)S.tryKind=kinds[0];
  return '<section class="trybar" aria-labelledby="try-h"><div><h2 id="try-h">What does it mean in your numbers?</h2><p class="note">Pick what you are exposed to and type its size. SignalPoint multiplies it by the move measured in the source. The amount shown is an example; change it.</p><div class="row" style="margin-top:14px"><label class="sr" for="try-kind">Kind of exposure</label><select id="try-kind" class="search">'+kinds.map(function(k){return '<option value="'+k+'"'+(k===S.tryKind?" selected":"")+">"+esc(KINDS[k].label)+"</option>"}).join("")+'</select><label class="sr" for="try-amount">Amount in US dollars</label><input class="search" id="try-amount" type="number" min="1" step="any" inputmode="decimal" placeholder="Amount in USD" value="'+esc(S.tryAmount)+'"></div></div><div id="try-out" aria-live="polite">'+tryOut()+"</div></section>";
}
/* ---------- Markets: the board. Snapshot data written by the editor from named sources; never live, never model-generated. ---------- */
var MGROUPS=["Stocks","Interest rates","Prices","Currencies","Energy","Crypto"];
function validMarket(m){
  if(!m||typeof m.name!=="string"||!m.name.trim()||MGROUPS.indexOf(m.group)<0)return false;
  if(!m.source||typeof m.source.name!=="string"||!/^https:\/\/[^\s]+$/.test(String(m.source.url||"")))return false;
  if(["official","provider","reported"].indexOf(m.basis)<0||typeof m.plain!=="string"||typeof m.why!=="string")return false;
  if(m.kind==="stat")return typeof m.valueText==="string"&&!!m.valueText.trim()&&/^\d{4}-\d{2}-\d{2}$/.test(String(m.asOf||""));
  return Array.isArray(m.series)&&m.series.length>=2&&m.series.length<=400&&m.series.every(function(p){return Array.isArray(p)&&/^\d{4}-\d{2}-\d{2}$/.test(String(p[0]))&&typeof p[1]==="number"&&isFinite(p[1])});
}
function mNorm(v){if(v&&!v.series&&Array.isArray(v.dates)&&Array.isArray(v.values)&&v.dates.length===v.values.length)v.series=v.dates.map(function(d,i){return [d,v.values[i]]});return v}
function mList(){return Object.keys(S.markets).map(function(id){var m=S.markets[id];m.id=id;return m}).sort(function(a,b){return (MGROUPS.indexOf(a.group)-MGROUPS.indexOf(b.group))||((a.order||0)-(b.order||0))||a.name.localeCompare(b.name)})}
function mNum(v,m){var d=typeof m.decimals==="number"?Math.max(0,Math.min(4,m.decimals)):2;return (m.prefix?String(m.prefix):"")+v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})+(m.suffix?String(m.suffix):"")}
function mLast(m){return m.series[m.series.length-1]}
function mChange(m,from){
  var a=m.series[from][1],b=mLast(m)[1];
  if(m.changeUnit==="pp"){var d=b-a;return {v:d,text:(d>0?"+":d<0?"−":"")+Math.abs(d).toFixed(2)+" pts"}}
  if(!a)return {v:0,text:"–"};var p=(b-a)/Math.abs(a)*100;return {v:p,text:(p>0?"+":p<0?"−":"")+Math.abs(p).toFixed(2)+"%"}
}
function mDir(v){return v>0?"up":v<0?"down":"flat"}
function spark(m,w,h){
  var s=m.series.map(function(p){return p[1]}),lo=Math.min.apply(null,s),hi=Math.max.apply(null,s),r=hi-lo||1;
  var pts=s.map(function(v,i){return (i/(s.length-1)*w).toFixed(1)+","+(h-2-(v-lo)/r*(h-4)).toFixed(1)}).join(" ");
  return '<svg class="spark" viewBox="0 0 '+w+" "+h+'" preserveAspectRatio="none" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';
}

function mTile(m){
  var sel=S.msel===m.id?' aria-current="true"':"";
  if(m.kind==="stat")return '<button class="tile-m" data-market="'+esc(m.id)+'"'+sel+'><span class="tm-name">'+esc(m.name)+'</span><span class="tm-spark"></span><span class="tm-val">'+esc(m.valueText)+'</span><span class="tm-chg flat">'+esc(fmtDate(m.asOf))+"</span></button>";
  var c=mChange(m,m.series.length-2),d=mDir(c.v);
  return '<button class="tile-m" data-market="'+esc(m.id)+'"'+sel+'><span class="tm-name">'+esc(m.name)+'</span><span class="tm-spark '+d+'">'+spark(m,100,30)+'</span><span class="tm-val">'+esc(mNum(mLast(m)[1],m))+'</span><span class="tm-chg '+d+'">'+esc(c.text)+"</span></button>";
}
function mChart(m){
  var W=600,H=160,s=m.series.map(function(p){return p[1]}),lo=Math.min.apply(null,s),hi=Math.max.apply(null,s),r=hi-lo||1,n=s.length;
  var xy=s.map(function(v,i){return [(i/(n-1)*W),(H-10-(v-lo)/r*(H-24))]});
  var line=xy.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1)}).join(" ");
  var gid="g"+String(m.id).replace(/[^a-z0-9]/gi,"");
  return '<div class="mchart '+mDir(mChange(m,0).v)+'" data-chart="'+esc(m.id)+'"><div class="mread" aria-hidden="true"></div><svg viewBox="0 0 '+W+" "+H+'" preserveAspectRatio="none" role="img" aria-label="'+esc(m.name)+" from "+esc(fmtDate(m.series[0][0]))+" to "+esc(fmtDate(mLast(m)[0]))+'"><defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".22"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>'+
    '<line class="grid" x1="0" x2="'+W+'" y1="14" y2="14"/><line class="grid" x1="0" x2="'+W+'" y1="'+(H-10)+'" y2="'+(H-10)+'"/>'+
    '<polygon class="area" points="0,'+H+" "+line+" "+W+","+H+'" fill="url(#'+gid+')"/><polyline class="ln" points="'+line+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>'+
    '<span class="mdot" style="left:100%;top:'+(xy[n-1][1]/H*100).toFixed(1)+'%"></span><span class="mcur" hidden></span></div>';
}
function mHeadline(){
  var ids=watched().filter(function(id){return S.markets[id].kind!=="stat"}).slice(0,3);
  if(!ids.length)ids=["sp500","us10y","eurusd"].filter(function(id){return S.markets[id]&&S.markets[id].series});
  return ids.map(function(id){var m=S.markets[id];m.id=id;return mClause(m)});
}
var PULSE=["sp500","us10y","eurusd","brent","btc"];
function mPulse(){
  return PULSE.filter(function(id){return S.markets[id]&&S.markets[id].series}).map(function(id){var m=S.markets[id];m.id=id;var c=mChange(m,m.series.length-2),d=mDir(c.v);
    return '<button class="pl" data-market="'+esc(id)+'"><span class="pl-n">'+esc(m.name)+'</span><span class="pl-v">'+esc(mNum(mLast(m)[1],m))+'</span><span class="pl-c '+d+'">'+esc(c.text)+'</span><span class="pl-s '+d+'">'+spark(m,120,34)+"</span></button>"}).join("");
}
function heatT(m){if(m.kind==="stat")return null;var c=mChange(m,m.series.length-2),sc=m.changeUnit==="pp"?0.1:(m.group==="Crypto"?5:(m.group==="Energy"?3:1.5));return Math.max(-1,Math.min(1,c.v/sc))}
function mHeat(){
  var list=mList();if(!list.length)return"";
  return '<section class="heat" aria-labelledby="ht-h"><div class="heat-head"><h2 id="ht-h">The last session at a glance</h2><p class="note">Colour strength shows the size of each move against what is normal for that market. Tap any square.</p></div><div class="heat-grid">'+list.map(function(m){
    var t=heatT(m),bg,fg,val,chg;
    if(t===null){bg="var(--sunk)";fg="var(--ink)";val=m.valueText;chg=fmtDate(m.asOf)}
    else{var a=(0.10+0.78*Math.abs(t)).toFixed(2);bg=t>=0?"rgba(18,140,64,"+a+")":"rgba(220,38,38,"+a+")";fg=Math.abs(t)>0.45?"#fff":"var(--ink)";val=mNum(mLast(m)[1],m);chg=mChange(m,m.series.length-2).text}
    return '<button class="hc" data-market="'+esc(m.id)+'" style="background:'+bg+';color:'+fg+'"><span class="hc-n">'+esc(m.name)+'</span><span class="hc-v">'+esc(val)+'</span><span class="hc-c">'+esc(chg)+"</span></button>"}).join("")+"</div></section>";
}
function mHero(){
  var cl=mHeadline(),list=mList().filter(function(m){return m.kind!=="stat"});
  var from="",to="";list.forEach(function(m){var a=m.series[0][0],b=mLast(m)[0];if(!from||a<from)from=a;if(b>to)to=b});
  var tape=list.map(function(m){var c=mChange(m,m.series.length-2),d=mDir(c.v);return '<span class="tp"><b>'+esc(m.name)+"</b> "+esc(mNum(mLast(m)[1],m))+' <i class="'+d+'">'+esc(c.text)+"</i></span>"}).join("");
  return '<section class="mhero" aria-labelledby="mh1"><div class="mh-in"><div class="mh-l"><p class="mh-k">'+(from?esc(fmtDate(from))+" – "+esc(fmtDate(to)):"")+'</p><h1 id="mh1">'+(cl.length?cl.map(function(c,i){return '<button class="clause" data-market="'+esc(c.id)+'" style="--i:'+i+'">'+esc(c.lead)+' <span class="'+c.dir+'">'+esc(c.num)+"</span>"+esc(c.tail||"")+".</button>"}).join(" "):"The market in plain words.")+"</h1>"+
    '<div class="cmd"><label class="sr" for="mq">Search markets, companies and events</label><input class="search" id="mq" type="search" autocomplete="off" placeholder="Search a market, a company or a theme" value="'+esc(S.mq||"")+'"><div id="mq-out" aria-live="polite">'+mSearch()+"</div></div>"+followRow()+
    '<p class="mwhen">Closing values entered by hand from the source named on each market. Not real time. Colour shows direction, not good or bad.</p></div><div class="mh-r" aria-label="Key markets">'+mPulse()+"</div></div>"+
    (tape?'<div class="tape" aria-hidden="true"><div class="tape-run">'+tape+tape+"</div></div>":"")+"</section>";
}
function mRelated(m){var ids=arr(m.related).map(String);return all().filter(function(b){return !b.private&&ids.indexOf(b.id)>=0})}
function mDetail(m){
  if(!m)return '<div class="empty">Pick a market to see what it is, what moved it and what comes next.</div>';
  var rel=mRelated(m),next=[];rel.forEach(function(b){(b.watch||[]).forEach(function(w){if(w.due&&stOf(w)==="open")next.push({b:b,w:w})})});
  next.sort(function(a,b){return String(a.w.due).localeCompare(String(b.w.due))});
  var seen={};next=next.filter(function(n){var k=n.w.due+"|"+n.w.text;if(seen[k])return false;seen[k]=1;return true}).slice(0,4);
  var basis={official:"Official figure",provider:"Published by the index or data provider",reported:"As reported by press"}[m.basis];
  var head='<article class="paper mdetail"><div class="meta"><span>'+esc(m.group)+"</span><span>"+esc(basis)+"</span></div><h2>"+esc(m.name)+"</h2>";
  var act='<div class="row mact"><button class="btn'+(S.watch.indexOf(m.id)>=0?"":" ghost")+'" data-follow="'+esc(m.id)+'" aria-pressed="'+(S.watch.indexOf(m.id)>=0)+'">'+(S.watch.indexOf(m.id)>=0?"\u2713 In my list":"+ Add to my list")+"</button>"+(lessonFor(m.id)?'<button class="btn ghost" data-lesson="'+lessonFor(m.id).id+'">Learn: '+esc(lessonFor(m.id).title)+" \u00B7 "+lessonFor(m.id).min+" min</button>":"")+"</div>";
  var body;
  if(m.kind==="stat")body='<p class="mbig">'+esc(m.valueText)+'</p><p class="note">'+esc(m.note||"")+" As of "+esc(fmtDate(m.asOf))+".</p>";
  else{
    var last=mLast(m),c1=mChange(m,m.series.length-2),c0=mChange(m,0),vals=m.series.map(function(p){return p[1]}),d=mDir(c0.v);
    body='<p class="mbig">'+esc(mNum(last[1],m))+' <span class="tm-chg '+mDir(c1.v)+'">'+esc(c1.text)+' on the day</span></p>'+mChart(m)+'<div class="mrow"><span>'+esc(fmtDate(m.series[0][0]))+"</span><span>"+esc(fmtDate(last[0]))+'</span></div>'+
      '<div class="mstats"><div><b>'+esc(c0.text)+"</b><span>since "+esc(fmtDate(m.series[0][0]))+"</span></div><div><b>"+esc(mNum(Math.max.apply(null,vals),m))+"</b><span>high in this window</span></div><div><b>"+esc(mNum(Math.min.apply(null,vals),m))+"</b><span>low in this window</span></div></div>";
  }
  return head+body+act+
    '<section class="sec"><h4>What it is</h4><p>'+esc(m.plain)+'</p></section><section class="sec"><h4>Why it matters to you</h4><p>'+esc(m.why)+"</p></section>"+
    (rel.length?'<section class="sec"><h4>Related events</h4><ul class="plain">'+rel.slice(0,4).map(function(b){return '<li class="cp"><span class="due">'+esc(fmtDate(b.eventDate))+'</span><button class="linkish" data-open="'+esc(b.id)+'">'+esc(b.title)+"</button></li>"}).join("")+"</ul></section>":"")+
    (next.length?'<section class="sec"><h4>What comes next</h4><ul class="plain">'+next.map(function(n){return '<li class="cp"><span class="due">'+esc(fmtDate(n.w.due))+"</span><span>"+esc(n.w.text)+"</span></li>"}).join("")+"</ul></section>":"")+
    (m.kindKey&&KINDS[m.kindKey]?'<section class="sec numbers"><h4>In your numbers</h4><p>Have '+esc(KINDS[m.kindKey].label.toLowerCase())+'? Enter the amount and see what a measured move is worth against it.</p><button class="btn" data-trykind="'+esc(m.kindKey)+'">Work it out</button></section>':"")+
    '<p class="note" style="margin-top:22px">Source: <a href="'+esc(m.source.url)+'" target="_blank" rel="noopener noreferrer">'+esc(m.source.name)+"</a>. "+(m.kind==="stat"?"":"Daily closing values, latest "+esc(fmtDate(mLast(m)[0]))+". ")+"Entered by hand from the source; not real time. Not advice.</p></article>";
}
function mSearch(){
  var q=String(S.mq||"").trim().toLowerCase();if(!q)return"";
  var ms=mList().filter(function(m){return (m.name+" "+arr(m.aliases).join(" ")+" "+m.group).toLowerCase().indexOf(q)>=0}).slice(0,5);
  var bs=all().filter(function(b){return !b.private&&hay(b).indexOf(q)>=0}).slice(0,5);
  if(!ms.length&&!bs.length)return '<div class="cmd-res"><p class="note">Nothing here matches “'+esc(S.mq)+'”. Try a market (10-year, dollar, oil), a company or a theme.</p></div>';

 {id:"index",title:"What a stock index tells you",min:2,markets:["sp500","nasdaq","dow"],steps:["A stock index is one number that summarises the prices of many companies at once. The S&P 500 follows 500 large US companies; the Dow follows 30; the Nasdaq Composite leans toward technology.","When an index rises 1%, the companies in it are worth about 1% more in total than the day before. Bigger companies count for more in most indexes, so a few giants can move the whole number.","A fund that tracks an index moves almost exactly with it. That is why one day's change says little, and why the direction over months and years is what a long-term saver actually experiences."]},

document.addEventListener("change",function(e){if(e.target.id==="wi-kind"){S.wiKind=e.target.value;S.wiMove=null;return render()}if(e.target.id==="try-kind"){S.tryKind=e.target.value;var o=$("try-out");if(o)o.innerHTML=tryOut()}});
document.addEventListener("pointermove",function(e){
  var c=e.target&&e.target.closest?e.target.closest(".mchart[data-chart]"):null;
  if(!c){var open=document.querySelectorAll(".mcur:not([hidden])");for(var i=0;i<open.length;i++){open[i].hidden=true;var rd=open[i].parentNode.querySelector(".mread");if(rd)rd.textContent=""}return}
  var m=S.markets[c.dataset.chart];if(!m||!m.series)return;
  var r=c.getBoundingClientRect();if(!r.width)return;
  var n=m.series.length,ix=Math.max(0,Math.min(n-1,Math.round((e.clientX-r.left)/r.width*(n-1)))),p=m.series[ix],cur=c.querySelector(".mcur"),read=c.querySelector(".mread");
  cur.hidden=false;cur.style.left=(ix/(n-1)*100)+"%";read.textContent=fmtDate(p[0])+"   "+mNum(p[1],m);
  var x=ix/(n-1)*r.width,w=read.offsetWidth||0;read.style.left=Math.max(0,Math.min(r.width-w,x-w/2))+"px";
});
document.addEventListener("submit",function(e){
  e.preventDefault();
  if(e.target.id==="item-form"){
    var kind=$("item-kind").value,amount=Number($("item-amount").value);
    if(!KINDS[kind]||!isFinite(amount)||amount<=0||amount>1e12)S.itemErr="Enter an amount above zero, in US dollars.";
    else if(S.items.length>=12)S.itemErr="You can keep up to 12 amounts. Remove one to add another.";
    else{S.itemErr="";S.items.push({id:"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),kind:kind,amount:amount});persist()}
    render();var f=$("item-amount");if(f)f.focus();return;
  }
  if(e.target.id==="wl-form"){var v=$("wl-in").value.trim();if(v&&S.wl.length<30&&S.wl.map(function(x){return x.toLowerCase()}).indexOf(v.toLowerCase())<0){S.wl.push(v);S.gone.terms=S.gone.terms.filter(function(x){return x!==v.toLowerCase()});invalidateReadings();persist()}render();var i=$("wl-in");if(i)i.focus()}
});
window.addEventListener("hashchange",function(){var h=location.hash.slice(1);if(VIEWS.indexOf(h)>=0&&h!==S.view){S.view=h;S.anim="view";render()}});

/* ---------- personal state: private db subtree, else this browser ---------- */
var LS="signalpoint.me";
var writeChain=Promise.resolve(),writeSequence=0;
function refreshSaveNote(){var note=$("save-note");if(note){note.textContent=S.saveNote;note.className="note"+(/^Could not/.test(S.saveNote)?" problem":"")}}
function stateBody(){return {watch:S.watch.slice(0,13),learned:S.learned,items:S.items.slice(0,12),wl:S.wl.slice(0,30),saved:S.saved.slice(0,40),desc:S.desc,descUpdatedAt:S.descUpdatedAt||0,example:S.example||"",lens:S.lens,gone:{terms:S.gone.terms.slice(-100),briefs:S.gone.briefs.slice(-100)}}}
function persist(){
  var body=JSON.parse(JSON.stringify(stateBody())),localOK=false;
  try{if(LSKEY){localStorage.setItem(LSKEY,JSON.stringify(body));localOK=true}}catch(e){S.saveNote="Could not save on this device. Keep this page open until your account confirms the save."}
  if(S.db&&S.uid){
    var sequence=++writeSequence,db=S.db,uid=S.uid;S.saveNote="Saving to your account…";
    writeChain=writeChain.then(function(){return db.collection("data/users/"+uid).doc("state").set(body)}).then(function(){if(sequence===writeSequence){S.saveNote="Saved to your account.";refreshSaveNote()}},function(){if(sequence===writeSequence){S.saveNote=localOK?"Could not save to your account. Your changes are kept on this device only.":"Could not save to your account or this device. Keep this page open and try saving again.";refreshSaveNote()}});
    return writeChain;
  }
}
function adopt(body){
  if(!body||typeof body!=="object"||Array.isArray(body))return;
  if(body.gone&&typeof body.gone==="object"){
    ["terms","briefs"].forEach(function(k){arr(body.gone[k]).forEach(function(x){if(typeof x==="string"&&S.gone[k].indexOf(x)<0)S.gone[k].push(x)})});
  }
  var revision=Number(body.descUpdatedAt);if(!Number.isFinite(revision)||revision<0)revision=0;
  if(typeof body.desc==="string"&&revision>=(S.descUpdatedAt||0)){
    if(S.desc!==body.desc)invalidateReadings();
    S.desc=body.desc.slice(0,600);S.descUpdatedAt=revision;
    S.example=Object.keys(EXAMPLES).indexOf(body.example)>=0?body.example:"";
    S.lens={};
    if(body.lens&&typeof body.lens==="object"&&!Array.isArray(body.lens)){
      Object.keys(body.lens).slice(0,40).forEach(function(id){
        var reading=body.lens[id];
        if(validReading(reading)){
          var txt=reading.points.map(function(p){return p.exposure+" "+p.why}).join(" ");
          if(!ADVICE.test(txt)&&!ADVICE2.test(txt))S.lens[id]=JSON.parse(JSON.stringify(reading));
        }
      });
    }
  }
  if(Array.isArray(body.watch))S.watch=body.watch.filter(function(x){return typeof x==="string"&&/^[a-z0-9]{1,24}$/.test(x)}).slice(0,13);
  if(body.learned&&typeof body.learned==="object"){var lr={};LESSONS.forEach(function(l){if(body.learned[l.id]===true)lr[l.id]=true});S.learned=lr}
  if(Array.isArray(body.items))S.items=body.items.filter(validItem).slice(0,12).map(function(x){return {id:x.id,kind:x.kind,amount:x.amount}});
  if(Array.isArray(body.wl))S.wl=body.wl.filter(function(x){return typeof x==="string"&&x.trim()}).slice(0,30);
  if(Array.isArray(body.saved))S.saved=body.saved.filter(function(b){return b&&typeof b.id==="string"&&b.title}).slice(0,40).map(function(b){b=JSON.parse(JSON.stringify(b));b.private=true;return b});
  if(!S.selectionTouched)S.sel=null;
}
var LSKEY=null;
function loadLocal(k){LSKEY=k;try{adopt(JSON.parse(localStorage.getItem(k)||"null"))}catch(e){}S.personalReady=true;render()}
S.canSave=true;

/* ---------- AI analysis ---------- */
var ADVICE=/\b(investors should|you should|we recommend|recommend (buying|selling|holding)|is a (strong )?(buy|sell)\b|price target of|our (price )?target)|\b\d{1,3}\s?%\s*confidence|\bconfidence\s*(of|is|:)?\s*\d{1,3}(\.\d+)?\s?%/i;
function ask(prompt,ms){
  var ac=new AbortController(),done=false,timer;
  var call=S.sample(prompt,{signal:ac.signal,cache:false}).then(function(r){done=true;clearTimeout(timer);return r.text});
  var late=new Promise(function(_,rej){timer=setTimeout(function(){if(!done){try{ac.abort()}catch(e){}rej({code:"timeout"})}},window.SP_TIMEOUT_MS||ms||45000)});
  call.catch(function(){clearTimeout(timer)});
  return Promise.race([call,late]);
}
function vd(d){if(!/^\d{4}-\d{2}-\d{2}$/.test(d||""))return false;var t=new Date(d+"T00:00:00Z");return !isNaN(t)&&t.toISOString().slice(0,10)===d}
function arr(x){return Array.isArray(x)?x:[]}
function parse(t){var m=String(t).match(/\{[\s\S]*\}/);return JSON.parse(m?m[0]:t)}
/* ---------- boot ---------- */
var h0=location.hash.slice(1);if(VIEWS.indexOf(h0)>=0)S.view=h0;else if(!h0&&!window.SP_HOME_BRIEFING)S.view="markets";S.anim="view";
render();
var timer=setTimeout(function(){if(!S.loaded){S.loaded=true;S.loadNote="Live briefs could not be reached. Sign in to Claude and reopen this page.";render()}},10000);
(async function(){
  if((!window.claude||!window.claude.use)&&window.SP_STATIC){
    clearTimeout(timer);var T=window.SP_STATIC;S.isStatic=true;
    S.briefs=arr(T.briefs).map(function(b){return JSON.parse(JSON.stringify(b))}).filter(validBrief);
    var mv={};Object.keys(T.moves||{}).forEach(function(id){var it=arr(T.moves[id].items).filter(validMove).slice(0,4);if(it.length)mv[id]=it});S.moves=mv;
    var mk={};Object.keys(T.markets||{}).forEach(function(id){var v=mNorm(JSON.parse(JSON.stringify(T.markets[id])));if(validMarket(v))mk[id]=v});S.markets=mk;
    S.runs=arr(T.runs);S.auto=T.auto||null;S.loaded=true;S.marketsReady=true;S.anim="view";
    return loadLocal(LS+".public");
  }
  if(!window.claude||!window.claude.use){clearTimeout(timer);S.loaded=true;S.loadNote="Live briefs load when this page is opened on claude.ai.";return loadLocal(LS+".anon")}
  window.claude.use("sample").then(function(s){S.sample=s;render()},function(){S.sample=null;render()});
  var db=await window.claude.use("db");
  if(!db){clearTimeout(timer);S.loaded=true;S.loadNote="Sign in to Claude to load the live briefs.";return loadLocal(LS+".anon")}
  S.db=db;
  db.collection("briefs").orderBy("eventDate","desc").limit(200).onSnapshot(function(snap){
    S.briefs=snap.docs.map(function(d){var x=JSON.parse(JSON.stringify(d.data()||{}));x.id=d.id;return x}).filter(validBrief);
    if(!snap.metadata||!snap.metadata.fromCache||S.briefs.length){clearTimeout(timer);if(!S.loaded)S.anim="view";S.loaded=true}
    render();
  },function(){clearTimeout(timer);S.loaded=true;S.loadNote="Live briefs are unavailable right now.";render()});
  db.collection("ingest_runs").orderBy("finishedAt","desc").limit(5).onSnapshot(function(snap){S.runs=snap.docs.map(function(d){return JSON.parse(JSON.stringify(d.data()||{}))});S.runsLoaded=true;render()},function(){S.runsLoaded=true;render()});
  db.collection("moves").limit(200).onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){var v=d.data()||{},items=arr(v.items).filter(validMove).slice(0,4);if(items.length)m[d.id]=JSON.parse(JSON.stringify(items))});S.moves=m;render()},function(){});
  db.collection("markets").limit(60).onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){var v=mNorm(JSON.parse(JSON.stringify(d.data()||{})));if(validMarket(v))m[d.id]=v});S.markets=m;if(!S.marketsReady&&S.view==="markets")S.anim="view";S.marketsReady=true;render()},function(){S.marketsReady=true;render()});
  db.doc("config/automation").onSnapshot(function(d){S.auto=d.exists?JSON.parse(JSON.stringify(d.data())):null;render()},function(){});
  try{
    var user=await window.claude.use("user");
    var uid=user&&await user.id();
    if(uid){
      var snap=await db.collection("data/users/"+uid).doc("state").get();
      S.uid=uid;loadLocal(LS+"."+uid);
      var lw=S.wl.slice(),ls=S.saved.slice(),ld=S.desc,remote=snap.exists?snap.data():null;
      if(remote){
        adopt(remote);
        var seen=S.wl.map(function(x){return x.toLowerCase()}),ids=S.saved.map(function(b){return b.id}),grew=false;
        lw.forEach(function(w){if(seen.indexOf(w.toLowerCase())<0&&S.gone.terms.indexOf(w.toLowerCase())<0&&S.wl.length<30){S.wl.push(w);grew=true}});
        ls.forEach(function(b){if(ids.indexOf(b.id)<0&&S.gone.briefs.indexOf(b.id)<0&&S.saved.length<40){S.saved.push(b);grew=true}});
        S.wl=S.wl.filter(function(w){return S.gone.terms.indexOf(w.toLowerCase())<0});S.saved=S.saved.filter(function(b){return S.gone.briefs.indexOf(b.id)<0});
        if(grew||(S.descUpdatedAt||0)>(Number(remote.descUpdatedAt)||0))persist();else{try{if(LSKEY)localStorage.setItem(LSKEY,JSON.stringify(stateBody()))}catch(e){}}
        render();
      }else if(lw.length||ls.length||ld){persist()}
    }else loadLocal(LS+".anon");
  }catch(e){if(!LSKEY)loadLocal(LS+".anon")}
})().catch(function(){clearTimeout(timer);S.loaded=true;S.loadNote="Live data could not be loaded. You can edit your exposure on this device.";loadLocal(LS+".anon")});
})();
</script>
