name: fetch-history
on:
  workflow_dispatch:
  schedule:
    - cron: '37 23 * * 1-5'   # weeknights, after the US close (18:37 Bogotá)
  push:
    branches: [main]
    paths: ['tools/fetch_history.py', 'tools/event_study.py', 'tools/parse_fomc.py', 'tools/build_live.py', 'tools/build_stocks.py', '.github/workflows/fetch-history.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_history.py out
      - name: Recompute event studies, similar days and live board prices
        run: |
          cd out
          python3 ../tools/parse_fomc.py fomc
          python3 ../tools/event_study.py > study.log 2>&1 || (cat study.log; exit 1)
          python3 ../tools/build_live.py .
          python3 ../tools/build_stocks.py . || echo 'stocks step failed; board data still published'
      - name: Publish data (not site code) to the data branch
        run: |
          cd out
          git init -q && git checkout -q -b data
          git add -A
          git -c user.name="signalpoint-bot" -c user.email="signalpoint-bot@users.noreply.github.com" commit -qm "Data $(date -u +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" data
